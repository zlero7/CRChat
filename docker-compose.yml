services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: crchat
      MYSQL_USER: crchat
      MYSQL_PASSWORD: crchat       # config.yml 의 database.password 를 이 값과 맞출 것
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
