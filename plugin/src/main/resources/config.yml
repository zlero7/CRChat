# ══════════════════════════════════════════
#  CRChat — 기본 설정
#  이 파일은 서버 인프라 설정입니다. 신중히 변경하세요.
# ══════════════════════════════════════════

# 이 서버의 고유 식별자. 벨로시티 산하 여러 서버를 MySQL 로 연동할 때
# 자기가 보낸 메시지를 자기가 또 받아 중복 표시하지 않는 데 씁니다.
# 서버마다 절대 겹치면 안 됩니다 (예: lobby, farm, dungeon).
server-id: "lobby"

database:
  host: "127.0.0.1"
  port: 3306
  name: "crchat"
  user: "crchat"
  password: "변경하세요"

# 크로스서버 채팅 연동 (13장 Phase 8). 위 database 접속 정보를 그대로 써서,
# 전체·공지·일반 채널 메시지를 다른 서버와 주고받습니다.
# 길드·파티는 아직 서버 로컬 판정만 가능해 연동 대상이 아닙니다.
network:
  # 서버가 하나뿐이면 false 로 둬도 정상 동작합니다(로컬 전달만).
  enabled: true
  # 다른 서버가 보낸 메시지를 확인하는 주기(틱, 20틱 = 1초).
  poll-interval-ticks: 10
  # 이보다 오래된 릴레이 기록은 자동으로 정리합니다.
  retention-hours: 24
